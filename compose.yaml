services:
  homedocs:
    build:
      context: .
      secrets:
        - npm_token
    ports:
      - "${HOMEDOCS_PORT:-8080}:8080"
    environment:
      HomeDocs__DataPath: /data
    volumes:
      - homedocs-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN

volumes:
  homedocs-data:
